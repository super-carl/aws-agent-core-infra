# Run SuperCarl locally with no AWS:  docker compose up
# Then:  curl -s localhost:8080/v1/health
services:
  supercarl-local:
    build:
      context: .
      dockerfile: local/Dockerfile
    image: supercarl-local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
